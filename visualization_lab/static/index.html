<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML算法可视化实验室</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-icon">◈</span>
            <div>
                <h1>ML算法可视化实验室</h1>
                <span class="subtitle">纯NumPy实现 · 交互式算法实验台</span>
            </div>
        </div>
        <div class="topbar-right">
            <span class="badge" id="algo-count">0 个算法</span>
            <button class="issue-btn" id="btn-issue" title="提交问题反馈（跳转 GitHub Issue）">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm9-3a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM6.75 7.75a.75.75 0 0 0 0 1.5h.75v2.25h-.75a.75.75 0 0 0 0 1.5h3a.75.75 0 0 0 0-1.5H9v-3a.75.75 0 0 0-.75-.75h-1.5Z"/>
                </svg>
                <span>问题反馈</span>
            </button>
            <span class="owner-tag" title="作者">
                <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                    <path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 1 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/>
                </svg>
                <span>Zane舞秋风</span>
            </span>
            <a class="star-btn" href="https://github.com/zanezhao0708/DataMiningAlgorithm" target="_blank" title="在 GitHub 上 Star 本项目">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"/>
                </svg>
                <span class="star-text">Star</span>
                <span class="star-count" id="star-count">-</span>
            </a>
        </div>
    </header>

    <main class="layout">
        <!-- 左侧控制面板 -->
        <aside class="sidebar">
            <nav class="tabs" id="task-tabs">
                <button class="tab active" data-task="classification">分类</button>
                <button class="tab" data-task="clustering">聚类</button>
                <button class="tab" data-task="regression">回归</button>
                <button class="tab" data-task="dim_reduction">降维</button>
            </nav>

            <!-- 控制区 -->
            <section class="panel">
                <div class="control-row">
                    <button class="btn play" id="btn-play" title="从初始状态开始播放训练动画">▶ 开始播放</button>
                    <button class="btn ghost small" id="btn-reset" title="重新生成数据并重跑">↻ 重置</button>
                </div>
                <div class="control" id="control-testratio">
                    <label>测试集比例 <span class="val" id="val-testratio">20%</span></label>
                    <input type="range" id="param-testratio" min="0" max="0.5" step="0.05" value="0.2">
                </div>
            </section>

            <!-- 数据区：缩略图选择 -->
            <section class="panel">
                <h2 class="panel-title">数据 <span class="panel-hint">点击切换</span></h2>
                <div class="dataset-grid" id="dataset-grid"></div>
                <div class="control">
                    <label>样本数 <span class="val" id="val-nsamples">300</span></label>
                    <input type="range" id="param-nsamples" min="60" max="600" step="20" value="300">
                </div>
                <div class="control">
                    <label>噪声 <span class="val" id="val-noise">0.15</span></label>
                    <input type="range" id="param-noise" min="0" max="0.5" step="0.01" value="0.15">
                </div>
                <div class="control" id="control-nclasses" hidden>
                    <label>类别数 <span class="val" id="val-nclasses">3</span></label>
                    <input type="range" id="param-nclasses" min="2" max="6" step="1" value="3">
                </div>
            </section>

            <!-- 算法区 -->
            <section class="panel">
                <h2 class="panel-title">算法</h2>
                <div class="algo-list" id="algo-list"></div>
            </section>

            <!-- 参数区 -->
            <section class="panel">
                <h2 class="panel-title">参数</h2>
                <div id="param-container"></div>
            </section>
        </aside>

        <!-- 右侧可视化区 -->
        <section class="stage">
            <div class="stage-head">
                <div class="stage-title-row">
                    <h2 id="stage-title">选择算法</h2>
                    <button class="btn source-toggle" id="btn-source" title="展开/收起当前算法的Python源码">查看源码</button>
                </div>
                <div class="metrics" id="metrics"></div>
            </div>

            <div class="canvas-wrap">
                <canvas id="main-canvas"></canvas>
                <div class="loading" id="loading" hidden>
                    <div class="spinner"></div>
                    <span>计算中...</span>
                </div>
            </div>

            <!-- 动画控制条 -->
            <div class="anim-bar" id="anim-bar" hidden>
                <button class="btn icon" id="anim-prev" title="上一帧">⏮</button>
                <button class="btn icon" id="anim-play" title="播放/暂停">▶</button>
                <button class="btn icon" id="anim-next" title="下一帧">⏭</button>
                <button class="btn icon speed" id="anim-speed" title="播放速度">1×</button>
                <input type="range" id="anim-slider" min="0" max="0" step="1" value="0">
                <span class="anim-label" id="anim-label">帧 0</span>
            </div>

            <!-- 损失曲线 -->
            <div class="chart-panel" id="chart-panel" hidden>
                <h3>训练损失 / 准确率</h3>
                <canvas id="loss-canvas" height="120"></canvas>
            </div>

            <!-- 决策树面板 -->
            <div class="tree-panel" id="tree-panel" hidden>
                <h3>决策树结构 <span class="tree-hint">（随机森林展示第一棵树）</span></h3>
                <div class="tree-scroll" id="tree-container"></div>
            </div>

            <!-- 源码弹窗 -->
            <div class="source-overlay" id="source-overlay" hidden>
                <div class="source-dialog">
                    <div class="source-head">
                        <span class="source-path" id="source-path"></span>
                        <div class="source-actions">
                            <a class="btn icon" id="source-github" href="#" target="_blank" title="在 GitHub 上查看">↗</a>
                            <button class="btn icon" id="source-close" title="关闭源码">×</button>
                        </div>
                    </div>
                    <pre id="source-code"></pre>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
